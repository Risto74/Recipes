name: Keep Supabase awake

on:
  schedule:
    - cron: '17 13 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write a timestamp to the keepalive table
        run: |
          curl -sS -f -X PATCH "https://bkvikqntpisfnkdlules.supabase.co/rest/v1/keepalive?id=eq.1" \
            -H "apikey: sb_publishable_d4KL76DV7rAfWQmUgIWzOA_G1THfOAl" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"pinged_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
